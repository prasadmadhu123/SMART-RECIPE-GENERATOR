<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Results</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 2em;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 100%;
            margin: auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            padding: 2.5em;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
        }

        /* --- Styled Recipe Card --- */
        .recipe-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1em 1.5em;
            background-color: #fdfdfd;
            margin-bottom: 1.5em;
            line-height: 1.7;
            color: #34495e;
        }

        .recipe-card h3 {
            margin-top: 0;
            margin-bottom: 0.5em;
            color: #0056b3;
        }
        
        .recipe-card p {
            margin-bottom: 0.5em;
        }

        /* --- Back Button --- */
        .back-link {
            display: inline-block;
            text-decoration: none;
            color: #007bff;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #007bff;
            margin-top: 1em;
            
            /* --- THE TRANSITION --- */
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background-color: #007bff;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Matching Recipes</h1>

        {% for recipe in recipes %}
            <div class="recipe-card">
                <h3>{{ recipe.name }}</h3>
                <p><strong>Matches:</strong> {{ recipe.match_count }} ingredient(s)</p>
                <p><strong>Instructions:</strong> {{ recipe.instructions }}</p>
            </div>
        {% else %}
            <p>No recipes found matching your selected ingredients.</p>
        {% endfor %}

        <a href="/" class="back-link">← Back to ingredient selection</a>
    </div>
</body>
</html>
