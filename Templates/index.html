<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Recipe Generator</title>
    <style>
        /* --- General Setup --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 2em;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Main Content Card --- */
        .container {
            max-width: 700px;
            width: 100%;
            margin: auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            padding: 2.5em;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
        }
        
        p {
            color: #34495e;
            font-size: 1.1em;
            line-height: 1.6;
        }

        /* --- Ingredient Checkbox Grid --- */
        .ingredient-list {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .ingredient-list li label {
            display: flex;
            align-items: center;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            color: #34495e;
            
            /* --- THE TRANSITION --- */
            transition: all 0.2s ease-in-out;
        }
        
        .ingredient-list li label:hover {
            background: #eef;
            transform: scale(1.03);
        }

        .ingredient-list input[type="checkbox"] {
            margin-right: 10px;
        }
        
        /* --- Submit Button --- */
        .submit-btn {
            background-color: #007bff;
            color: white;
            font-size: 1.2em;
            font-weight: 600;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5em;
            
            /* --- THE TRANSITION --- */
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart Recipe Generator</h1>
        <p>Select the ingredients you have:</p>
        
        <form id="recipe-form" action="/generate" method="post">
            <ul class="ingredient-list">
                {% for ingredient in ingredients %}
                <li>
                    <label>
                        <input type="checkbox" name="ingredient_id" value="{{ ingredient.id }}">
                        {{ ingredient.name }}
                    </label>
                </li>
                {% endfor %}
            </ul>
            
            <button type="submit" class="submit-btn">Find Recipes</button>
        </form>
    </div>

</body>
</html>
